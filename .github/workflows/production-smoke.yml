name: production-smoke

# Authoritative production verification for https://drishti-ai-command-center.vercel.app
# Runs after the production deploy workflow succeeds (and on demand).
# The GitHub runner itself makes direct HTTP/WebSocket requests via the
# zero-dependency reusable script (also runnable locally: npm run smoke:production).
# No browser scraping, no external checkers, no secrets.

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    # Only run when the deploy workflow itself succeeded (manual runs always proceed).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Production smoke test (routes + gate + health + WebSocket)
        run: npm run smoke:production
