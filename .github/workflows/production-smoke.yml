name: production-smoke

# Post-deployment verification for https://drishti-ai-command-center.vercel.app
# Runs after the production deploy workflow succeeds (and on demand).
# Distinguishes real failures from Vercel propagation delay via retries.

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    # Only run when the deploy workflow itself succeeded (manual runs always proceed).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASE: https://drishti-ai-command-center.vercel.app
    steps:
      - name: Smoke-test production routes + backend health
        run: |
          FAIL=0
          check_route() {
            path="$1"
            # retry every 15s for up to ~6 minutes (Vercel propagation window)
            for i in $(seq 1 24); do
              code=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 25 "$BASE$path" || echo "000")
              if [ "$code" = "200" ]; then
                if grep -qiE "Application Error|Internal Server Error|404: Not Found|Deployment Error" /tmp/body.html; then
                  echo "ERROR-PAGE detected at $path (attempt $i)"
                else
                  echo "PASS $path -> 200 (attempt $i)"
                  return 0
                fi
              else
                echo "retry $path -> HTTP $code (attempt $i/24)"
              fi
              sleep 15
            done
            echo "FAIL $path never returned clean HTTP 200"
            FAIL=1
          }

          for p in / /command /weather /satellite /events /earthquakes /risk-map; do
            check_route "$p"
          done

          echo "--- backend health ---"
          for i in $(seq 1 24); do
            body=$(curl -s --max-time 25 "$BASE/api/backend/api/health" || echo "")
            if echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('ok') is True else 1)" 2>/dev/null; then
              echo "PASS /api/backend/api/health -> $body (attempt $i)"
              break
            else
              echo "retry /api/backend/api/health -> '$body' (attempt $i/24)"
            fi
            if [ "$i" = "24" ]; then echo "FAIL backend health never returned {\"ok\": true}"; FAIL=1; fi
            sleep 15
          done

          exit $FAIL
