# ── DRISHTI-X model config (EXAMPLE — committed) ────────────
# Step 1: contracts only. No training, no metrics, no binaries.
# data_status for any model output ∈ FORECAST | SIMULATED | DEMO | UNAVAILABLE (never LIVE for a prediction).
version: 1
models:
  rainfall_prediction:
    status: "NOT_TRAINED"
    framework_candidates: ["xgboost/lightgbm-baseline", "pytorch-temporal-spatial"]
    horizons: ["24h", "48h", "72h"]
    outputs: ["accumulation_grid", "exceedance_probability_grid", "uncertainty_grid"]
  nowcasting:
    status: "NOT_TRAINED"
    horizon: "0-6h"
    inputs: ["radar(reflectivity-class)", "satellite", "observations"]
    outputs: ["rainrate_grid", "uncertainty_grid"]
  inundation:
    status: "NOT_TRAINED"
    inputs: ["rainfall_grids", "dem_derivatives", "drainage_capacity_meta"]
    outputs: ["depth_grid", "extent_geojson", "uncertainty_grid"]
evaluation:
  protocol: "time-based + event-based held-out splits; no leakage (temporal + spatial blocking)"
  metrics: ["brier", "roc-auc", "reliability", "f1/iou-extent", "mae/rmse/bias-depth"]
  rule: "never fabricate scores — report only measured values with dataset + version"
registry:
  location: "models/ (docs only in Step 1; binaries via releases/object storage later)"
