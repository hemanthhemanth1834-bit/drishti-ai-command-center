<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark base -->
  <rect width="64" height="64" rx="12" fill="#020b14"/>
  <!-- Outer orbital ring -->
  <circle cx="32" cy="32" r="28" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <!-- Inner data ring -->
  <circle cx="32" cy="32" r="19" stroke="#00d2ff" stroke-width="1" opacity="0.35"/>
  <!-- Cybernetic Eye Iris -->
  <circle cx="32" cy="32" r="10" fill="#06182e" stroke="#00d2ff" stroke-width="2"/>
  <!-- Eye Pupil (AI Neural Core) -->
  <circle cx="32" cy="32" r="5" fill="#00d2ff" opacity="0.9"/>
  <!-- Central bright highlight -->
  <circle cx="32" cy="32" r="2.5" fill="white" opacity="0.85"/>
  <!-- Radar scan cross-hairs -->
  <line x1="32" y1="12" x2="32" y2="20" stroke="#00d2ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="44" x2="32" y2="52" stroke="#00d2ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="12" y1="32" x2="20" y2="32" stroke="#00d2ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="44" y1="32" x2="52" y2="32" stroke="#00d2ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Corner tick marks (tactical) -->
  <path d="M 8 20 L 8 8 L 20 8" stroke="#00d2ff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 44 8 L 56 8 L 56 20" stroke="#00d2ff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 56 44 L 56 56 L 44 56" stroke="#00d2ff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 20 56 L 8 56 L 8 44" stroke="#00d2ff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Orbiting node dots -->
  <circle cx="32" cy="4" r="2.2" fill="#00d2ff" opacity="0.65"/>
  <circle cx="60" cy="32" r="2.2" fill="#00d2ff" opacity="0.55"/>
  <circle cx="32" cy="60" r="2.2" fill="#00d2ff" opacity="0.65"/>
  <circle cx="4" cy="32" r="2.2" fill="#00d2ff" opacity="0.55"/>
  <!-- Inner glow -->
  <circle cx="32" cy="32" r="5" fill="#00d2ff" opacity="0.15"/>
</svg>
