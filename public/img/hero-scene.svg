<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cinematic disaster-intelligence backdrop with city skyline, cyclone, mountains and data arc">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020712"/><stop offset=".55" stop-color="#062033"/><stop offset="1" stop-color="#020712"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".62" r=".45">
      <stop offset="0" stop-color="#00d2ff" stop-opacity=".28"/><stop offset="1" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d2ff" stop-opacity="0"/><stop offset=".5" stop-color="#00d2ff"/><stop offset="1" stop-color="#00d2ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#sky)"/>
  <g fill="#ffffff" opacity=".5">
    <circle cx="120" cy="60" r="1.3"/><circle cx="300" cy="120" r="1"/><circle cx="520" cy="50" r="1.4"/><circle cx="700" cy="140" r="1"/>
    <circle cx="900" cy="60" r="1.3"/><circle cx="1120" cy="130" r="1"/><circle cx="1300" cy="55" r="1.4"/><circle cx="1480" cy="120" r="1"/>
    <circle cx="200" cy="200" r="1"/><circle cx="600" cy="210" r="1.2"/><circle cx="1000" cy="200" r="1"/><circle cx="1400" cy="210" r="1.2"/>
  </g>
  <!-- city skyline left -->
  <g fill="#0a2036">
    <rect x="0" y="300" width="60" height="200"/><rect x="70" y="260" width="46" height="240"/>
    <rect x="124" y="310" width="70" height="190"/><rect x="204" y="240" width="40" height="260"/>
    <rect x="252" y="300" width="64" height="200"/><rect x="1330" y="290" width="52" height="210"/>
    <rect x="1390" y="250" width="44" height="250"/><rect x="1442" y="305" width="66" height="195"/>
    <rect x="1516" y="270" width="48" height="230"/>
  </g>
  <g fill="#00d2ff" opacity=".55">
    <rect x="78" y="272" width="6" height="6"/><rect x="92" y="272" width="6" height="6"/><rect x="78" y="288" width="6" height="6"/>
    <rect x="212" y="252" width="6" height="6"/><rect x="226" y="252" width="6" height="6"/><rect x="212" y="268" width="6" height="6"/>
    <rect x="1398" y="262" width="6" height="6"/><rect x="1412" y="262" width="6" height="6"/><rect x="1398" y="278" width="6" height="6"/>
    <rect x="1524" y="282" width="6" height="6"/><rect x="1538" y="282" width="6" height="6"/>
  </g>
  <!-- mountains right -->
  <polygon points="1050,500 1250,220 1450,500" fill="#0b2540"/>
  <polygon points="1250,220 1320,320 1250,360 1180,320" fill="#e8f4ff" opacity=".25"/>
  <polygon points="1250,500 1420,280 1600,500" fill="#081c33"/>
  <polygon points="900,500 1020,330 1150,500" fill="#0a2036"/>
  <!-- cyclone swirl center-left -->
  <g fill="none" stroke="#7de9ff" opacity=".8">
    <circle cx="620" cy="330" r="12" stroke-width="3"/>
    <path d="M620 318 A44 44 0 0 1 664 330" stroke-width="8" stroke-linecap="round"/>
    <path d="M664 330 A64 64 0 0 1 620 394" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <path d="M620 394 A86 86 0 0 1 534 330" stroke-width="8" stroke-linecap="round" opacity=".5"/>
    <path d="M534 330 A108 108 0 0 1 620 222" stroke-width="8" stroke-linecap="round" opacity=".3"/>
  </g>
  <!-- glowing data arc -->
  <path d="M80 420 Q800 300 1520 420" stroke="url(#arc)" stroke-width="4" fill="none"/>
  <path d="M80 420 Q800 300 1520 420" stroke="#00d2ff" stroke-width="10" opacity=".12" fill="none"/>
  <rect width="1600" height="500" fill="url(#core)"/>
  <!-- GIS nodes on arc -->
  <g fill="#00d2ff">
    <circle cx="400" cy="382" r="4"/><circle cx="650" cy="360" r="4"/><circle cx="950" cy="360" r="4"/><circle cx="1200" cy="382" r="4"/>
  </g>
  <g stroke="#00d2ff" opacity=".5">
    <line x1="400" y1="382" x2="400" y2="430"/><line x1="650" y1="360" x2="650" y2="430"/>
    <line x1="950" y1="360" x2="950" y2="430"/><line x1="1200" y1="382" x2="1200" y2="430"/>
  </g>
</svg>
